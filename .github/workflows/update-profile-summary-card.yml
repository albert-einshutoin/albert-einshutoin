name: Update profile summary card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-summary-card
  cancel-in-progress: false

jobs:
  generate:
    name: Generate language activity card
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@89776cd44fb40c4f7b3e5c2db993728cd700d638 # release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 9
          AUTO_PUSH: false
          THEME: transparent

      - name: Keep and publish the language activity card
        shell: bash
        run: |
          test -s profile-summary-card-output/transparent/1-repos-per-language.svg
          if grep -Eq 'ERROR|rate limit' \
            profile-summary-card-output/transparent/1-repos-per-language.svg; then
            exit 1
          fi

          find profile-summary-card-output -type f \
            ! -path 'profile-summary-card-output/transparent/1-repos-per-language.svg' \
            -delete
          find profile-summary-card-output -type d -empty -delete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/transparent/1-repos-per-language.svg

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update profile language card"
          git pull --rebase origin main
          git push origin HEAD:main
